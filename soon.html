<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SASS – Coming Soon</title>

  <!-- Read saved theme immediately -->
  <script>
    (function(){
      var theme = localStorage.getItem('sass_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s;
    }

    .container {
      position: relative;
      text-align: center;
    }

    /* ============ MORPHING ORB (main animation) ============ */
    .orb {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
    }

    .orb-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--primary), var(--purple));
      box-shadow: 0 0 60px var(--glow), 0 0 120px rgba(139,92,246,0.3);
      animation: morphOrb 4s ease-in-out infinite;
      position: absolute;
      top: 0;
      left: 0;
    }

    @keyframes morphOrb {
      0%, 100% {
        border-radius: 50% 50% 50% 50%;
        transform: scale(1) rotate(0deg);
      }
      25% {
        border-radius: 60% 40% 60% 40%;
        transform: scale(1.2) rotate(90deg);
      }
      50% {
        border-radius: 40% 60% 40% 60%;
        transform: scale(1.1) rotate(180deg);
      }
      75% {
        border-radius: 55% 45% 55% 45%;
        transform: scale(1.15) rotate(270deg);
      }
    }

    /* Orbiting particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--blue);
      border-radius: 50%;
      animation: orbit 3s linear infinite;
      box-shadow: 0 0 8px var(--blue);
    }

    .particle:nth-child(1) { animation-delay: 0s; }
    .particle:nth-child(2) { animation-delay: -0.75s; }
    .particle:nth-child(3) { animation-delay: -1.5s; }
    .particle:nth-child(4) { animation-delay: -2.25s; }

    @keyframes orbit {
      0% {
        transform: rotate(0deg) translateX(80px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: rotate(360deg) translateX(80px) rotate(-360deg);
        opacity: 0.6;
      }
    }

    /* SASS Logo inside the orb */
    .orb-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.4rem;
      color: #fff;
      z-index: 2;
      animation: pulseText 2s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    @keyframes pulseText {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Progress bar */
    .progress-track {
      width: 260px;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 0 auto 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--gold));
      border-radius: 4px;
      animation: fillBar 2.5s ease-out forwards;
    }

    @keyframes fillBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* Text reveal */
    .coming-text {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeInUp 0.8s ease 2.7s forwards;
      margin-bottom: 8px;
    }

    .sub-text {
      color: var(--text2);
      font-size: 1rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 3s forwards;
      margin-bottom: 30px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-link {
      opacity: 0;
      animation: fadeInUp 0.8s ease 3.3s forwards;
    }

    .back-link a {
      color: var(--text2);
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link a:hover { color: var(--blue); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Morphing orb with particles and logo -->
    <div class="orb">
      <div class="orb-core"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="orb-logo"><i class="fa-solid fa-graduation-cap"></i></div>
    </div>

    <!-- Loading bar -->
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <!-- Reveal text after animation -->
    <h1 class="coming-text">Something amazing is on the way</h1>
    <p class="sub-text">We’re building the future of education. Stay tuned!</p>

    <div class="back-link">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</body>
</html>
