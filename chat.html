<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SASS – Chat</title>

  <!-- Read saved theme immediately -->
  <script>
    (function(){
      var theme = localStorage.getItem('sass_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Central theme -->
  <link rel="stylesheet" href="theme.css">

  <style>
    /* local additions */
    :root {
      --red: #ef4444;       /* for delete button */
      --radius: 12px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;                /* prevent body scroll */
    }

    /* ===== Fixed Header ===== */
    .chat-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
    }
    .chat-header i { color: var(--blue); }

    /* ===== Scrollable Message Area ===== */
    .chat-area {
      height: 100vh;
      overflow-y: auto;
      padding-top: 56px;      /* prevent hiding behind header */
      padding-bottom: 68px;   /* prevent hiding behind input */
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      position: relative;
    }
    .message.sent { align-self: flex-end; }
    .message.received { align-self: flex-start; }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .sent .message-bubble {
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .received .message-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-sender {
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 2px;
      padding: 0 4px;
    }
    .message-time {
      font-size: 0.7rem;
      color: var(--text2);
      margin-top: 2px;
      padding: 0 4px;
      align-self: flex-end;
    }

    .delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .message:hover .delete-btn { display: flex; }

    /* ===== Fixed Input Area ===== */
    .chat-input {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .chat-input button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .chat-input button:hover { opacity: 0.9; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text2);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Fixed header -->
  <div class="chat-header">
    <i class="fa-solid fa-comments"></i>
    <span>School Chat</span>
  </div>

  <!-- Scrollable chat area -->
  <main class="chat-area" id="chat-area">
    <div class="chat-messages" id="chat-messages">
      <div class="loading" id="chat-loading">
        <div class="spinner"></div>
        <p>Connecting…</p>
      </div>
    </div>
  </main>

  <!-- Fixed input -->
  <div class="chat-input">
    <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off">
    <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import {
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      getDocs,
      where,
      doc,
      getDoc,
      deleteDoc
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const messagesContainer = document.getElementById('chat-messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const loadingEl = document.getElementById('chat-loading');

    let currentUser = null;
    let displayName = 'User';
    let isAdmin = false;

    // Listen for auth state
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        loadingEl.innerHTML = '<p>Please log in to use the chat.</p>';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        return;
      }

      currentUser = user;
      displayName = user.email ? user.email.split('@')[0] : 'User';

      // Check if admin
      try {
        const adminDoc = await getDoc(doc(db, "admins", user.uid));
        if (adminDoc.exists() && adminDoc.data().role === 'admin') {
          isAdmin = true;
        }
      } catch (e) {
        isAdmin = false;
      }

      messageInput.disabled = false;
      sendBtn.disabled = false;
      loadingEl.style.display = 'none';

      // Real‑time listener
      const q = query(collection(db, "chat"), orderBy("timestamp", "asc"));
      onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = '';
        if (snapshot.empty) {
          messagesContainer.innerHTML = '<div class="loading"><p>No messages yet. Start the conversation!</p></div>';
          return;
        }

        snapshot.forEach(doc => {
          const msg = doc.data();
          const isSentByMe = msg.uid === currentUser.uid;
          const time = msg.timestamp
            ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : '';

          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${isSentByMe ? 'sent' : 'received'}`;
          msgDiv.innerHTML = `
            ${!isSentByMe ? `<div class="message-sender">${escapeHTML(msg.displayName)}</div>` : ''}
            <div class="message-bubble">${escapeHTML(msg.text)}</div>
            <div class="message-time">${time}</div>
          `;

          // Delete button for admins
          if (isAdmin) {
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            delBtn.title = 'Delete message';
            delBtn.addEventListener('click', async (e) => {
              e.stopPropagation();
              if (confirm('Delete this message?')) {
                try {
                  await deleteDoc(doc(db, "chat", doc.id));
                } catch (err) {
                  console.error('Failed to delete message:', err);
                }
              }
            });
            msgDiv.appendChild(delBtn);
          }

          messagesContainer.appendChild(msgDiv);
        });

        // Scroll to bottom (use outer chat-area)
        document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
      });
    });

    // Send message
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      try {
        await addDoc(collection(db, "chat"), {
          uid: currentUser.uid,
          displayName: displayName,
          text: text,
          timestamp: serverTimestamp()
        });
        messageInput.value = '';
      } catch (err) {
        console.error('Failed to send message:', err);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
