<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SASS – News & Announcements</title>

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Central theme variables (must come first) -->
  <link rel="stylesheet" href="theme.css">

  <!-- Page-specific styles -->
  <style>
    /* very local variable (not part of the global theme) */
    :root {
      --radius: 12px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .announcement-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .announcement-card:hover {
      transform: translateY(-2px);
    }

    .announcement-card h3 {
      color: var(--blue);
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .announcement-card p {
      color: var(--text2);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .announcement-card .date {
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text2);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-newspaper"></i> News & Announcements</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="btn" title="Toggle theme">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
        <a href="index.html" class="btn">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>

    <div id="news-container">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading announcements…</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    // ==================== THEME ====================
    const theme = localStorage.getItem('sass_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    const themeToggle = document.getElementById('theme-toggle');

    function updateThemeButton() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeToggle.innerHTML = isDark
        ? '<i class="fa-solid fa-sun"></i> Theme'
        : '<i class="fa-solid fa-moon"></i> Theme';
    }
    updateThemeButton();

    themeToggle.addEventListener('click', () => {
      const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('sass_theme', newTheme);
      updateThemeButton();
    });

    // ==================== LOAD ANNOUNCEMENTS ====================
    async function loadAnnouncements() {
      const container = document.getElementById('news-container');
      try {
        const q = query(collection(db, "announcements"), orderBy("timestamp", "desc"));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          container.innerHTML = `
            <div style="text-align:center; padding:40px; color:var(--text2);">
              <i class="fa-solid fa-inbox" style="font-size:3rem; display:block; margin-bottom:16px;"></i>
              <p>No announcements yet. Check back later!</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        snap.forEach(doc => {
          const a = doc.data();
          const date = a.timestamp ? new Date(a.timestamp).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
          }) : 'Unknown date';
          
          const card = document.createElement('div');
          card.className = 'announcement-card';
          card.innerHTML = `
            <h3>${escapeHTML(a.title)}</h3>
            <p>${escapeHTML(a.content)}</p>
            <div class="date"><i class="fa-solid fa-clock"></i> ${date}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to load announcements:', err);
        container.innerHTML = '<div class="loading"><p style="color:var(--text2);">Failed to load announcements. Please try again later.</p></div>';
      }
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadAnnouncements();
  </script>
</body>
</html>
